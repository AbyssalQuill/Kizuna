# QQ 群聊与私聊 agent preset（纯API级无稀释精简版）。
# 零废话、零注意力稀释、全拟人自驱，完全释放角色的灵动灵魂。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      role_rp_agent
      pure_in_character
      no_bracket_acting
      no_action_narration
      no_system_boilerplate
      owner_authority_obey
      load_persona_tool: qq_load_persona
      send_msg_tool: qq_send_message
      private_no_reply_quote
      bubble_natural_short
      state_compact
      # === qq-bridge persona/rules BEGIN ===
      [PERSONA]
      call_tool_qq_load_persona_for_character
      # === qq-bridge persona/rules END ===

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: false
    fetch: false
- id: qq-tool-restrict
  name: ./qq-tool-restrict.mjs
  config: {}
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
  - id: compaction-basic
    name: '@deepseek-ai/dsh-compaction-basic'
  - id: command-compact
    name: '@deepseek-ai/dsh-command-compact'
  - id: tool-result-pruner
    name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
    config:
      thresholdChars: 25000
      headChars: 22800
      tailChars: 2000
