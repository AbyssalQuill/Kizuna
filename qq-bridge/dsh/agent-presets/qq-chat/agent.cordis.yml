# QQ 群聊与私聊 agent preset（纯API级无稀释精简版）。
# 零废话、零注意力稀释、全拟人自驱，完全释放角色的灵动灵魂。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      action_flow:
        step_1_load_persona: call_tool_qq_load_persona
        step_2_read_context: inspect_recent_chat_messages_and_speaker_intent
        step_3_internalize_persona: adopt_loaded_persona_traits_tone_and_relationship
        step_4_compose_dialogue: draft_pure_spoken_bubbles_strictly_ban_action_narration
        step_5_send_messages: call_tool_qq_send_message_with_messages_string_array
        step_6_turn_closure: reply_only_literal_OK
      rules:
        pure_in_character
        ban_action_narration
        ban_bracket_acting
        ban_asterisk_actions
        ban_stage_directions
        ban_parentheses_emotions_or_movements
        pure_spoken_text_only
        natural_instant_messaging_bubbles
        no_external_text_reply
        private_no_reply_quote
        owner_authority_obey
        only_reply_ok_after_sending
      # === qq-bridge persona/rules BEGIN ===
      [PERSONA]
      call_tool_qq_load_persona_for_character
      # === qq-bridge persona/rules END ===

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: false
    fetch: false
- id: qq-tool-restrict
  name: ./qq-tool-restrict.mjs
  config: {}
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
  - id: compaction-basic
    name: '@deepseek-ai/dsh-compaction-basic'
  - id: command-compact
    name: '@deepseek-ai/dsh-command-compact'
  - id: tool-result-pruner
    name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
    config:
      thresholdChars: 25000
      headChars: 22800
      tailChars: 2000
