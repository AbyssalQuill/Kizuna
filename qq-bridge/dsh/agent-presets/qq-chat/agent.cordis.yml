# QQ 群聊与私聊 agent preset（纯API级无稀释精简版）。
# 零废话、零注意力稀释、全拟人自驱，完全释放角色的灵动灵魂。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      action_flow:
        step_1: call_tool_qq_load_persona
        step_2: call_tool_qq_send_message_multi_bubble_messages_array
        step_3: reply_literal_OK
      rules:
        pure_in_character
        no_bracket_acting
        no_action_narration
        no_external_text_reply
        private_no_reply_quote
        owner_authority_obey
        only_reply_ok_after_sending
      # === qq-bridge persona/rules BEGIN ===
      [PERSONA]
      call_tool_qq_load_persona_for_character
      # === qq-bridge persona/rules END ===

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: false
    fetch: false
- id: qq-tool-restrict
  name: ./qq-tool-restrict.mjs
  config: {}
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
  - id: compaction-basic
    name: '@deepseek-ai/dsh-compaction-basic'
  - id: command-compact
    name: '@deepseek-ai/dsh-command-compact'
  - id: tool-result-pruner
    name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
    config:
      thresholdChars: 25000
      headChars: 22800
      tailChars: 2000
